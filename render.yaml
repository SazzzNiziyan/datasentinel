# Render Blueprint: one free web service running the web app, API and worker
# (Dockerfile.render). Values marked sync: false are asked for when you create
# the Blueprint; none of them are stored in this repository.
# Steps and limits: docs/13-render-free-deploy.md
services:
  - type: web
    name: datasentinel # pick a unique name; the address is https://<name>.onrender.com
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /api/health/live
    envVars:
      - key: LOG_LEVEL
        value: info
      - key: DB_POOL_MAX
        value: '3'
      # The service's own https address, for example https://datasentinel.onrender.com
      - key: WEB_ORIGIN
        sync: false
      - key: OAUTH_CALLBACK_BASE_URL
        sync: false
      # Neon: pooled address for the running app, direct address for migrations.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Cloudflare R2 (or any S3-compatible storage).
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      - key: S3_BUCKET_UPLOADS
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Generated by Render (random 256-bit values). Copy SECRETS_ENCRYPTION_KEY
      # to a password manager: without it, saved credentials cannot be read.
      - key: SESSION_SECRET
        generateValue: true
      - key: SECRETS_ENCRYPTION_KEY
        generateValue: true
      - key: SECRETS_ENCRYPTION_KEY_VERSION
        value: '1'
      # Optional: email through SMTP (Gmail app password or Brevo).
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Optional: AI investigation with Gemini. Off unless FEATURE_AI is true.
      - key: FEATURE_AI
        value: 'false'
      - key: AI_API_KEY
        sync: false
      - key: AI_PROVIDER_NAME
        value: Google Gemini
      - key: AI_PROVIDER_REGION
        value: Global (Google)
      - key: AI_RETENTION_NOTE
        value: Free tier. Google may use prompts to improve its models. Use synthetic data only.
